# Workflow do billing-service: chama o pipeline reutilizável do ci-templates.

name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pipeline:
    uses: jaimorais2007/ci-templates/.github/workflows/dotnet-service.yml@main
    with:
      service-name: billing-service
      sonar-project-key: jaimorais2007_billing-service
      # deploy: true   # ativar quando o cluster e o secret KUBE_CONFIG existirem
    permissions:
      contents: read
      packages: write
    secrets: inherit
